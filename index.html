<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<link rel="icon" type="image/png" href="" id="fav">
<title>Cue — Find your flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1020;--ink:#F4F5FA;--amber:#A855F7;--mut:#A3A9C2;--line:#252B45;--card:#121833;--navy:#0B1020;--red:#E5484D;--grad:linear-gradient(135deg,#6554F0,#A855F7);
--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:10px;
font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 var(--s4)}
.top{display:flex;align-items:center;justify-content:space-between;height:56px;padding-top:env(safe-area-inset-top)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:26px;letter-spacing:-.02em;text-decoration:none;color:var(--ink)}
.mk{width:30px;height:30px;border-radius:8px;display:block}
.ib{width:44px;height:44px;border:0;border-radius:var(--r);background:none;display:grid;place-items:center;text-decoration:none;color:inherit}
.ib:hover{background:#ffffff14}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
h1{font-size:34px;line-height:1.1;letter-spacing:-.025em;margin:var(--s5) 0 var(--s2);font-weight:700}
h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--mut);margin:0 0 var(--s5);font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:none;font-weight:600;font-size:16px}
.btn.amber{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px -12px #6554F0}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;min-height:44px;padding:0 var(--s4)}
.stack{display:grid;gap:var(--s3)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:var(--s6) 0 var(--s2)}
.link{background:none;border:0;color:var(--mut);font-size:14px;min-height:44px;padding:0 var(--s2);display:flex;align-items:center;text-decoration:none}
.list{border:1px solid var(--line);border-radius:16px;background:#ffffff08;margin:0;padding:0 var(--s2) 0 var(--s4);list-style:none}
.row{display:flex;align-items:center;gap:var(--s2);border-bottom:1px solid var(--line)}
.row .go{flex:1;min-width:0;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;background:none;border:0;text-align:left;min-height:60px}
.row .go svg{color:var(--mut)}
.row .t{min-width:0}
.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);font-size:13px}
.empty{padding:var(--s5) var(--s4);color:var(--mut);font-size:15px;border:1px solid var(--line);border-radius:16px;background:#ffffff08}.row:last-child{border-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;min-height:56px;font-size:12px;color:var(--mut);text-decoration:none;font-weight:500}
nav a[aria-current=page]{color:var(--ink);font-weight:600}
nav a[aria-current=page] svg{stroke:#B794FF}
.bar2{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;gap:var(--s2);height:56px;padding-top:env(safe-area-inset-top)}
.bar2 h1{margin:0;font-size:18px;letter-spacing:0}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:var(--s3) var(--s4);font-size:16px;min-height:48px}
textarea.field{display:block;min-height:46vh;min-height:46dvh;line-height:1.65;resize:vertical;font-size:17px;margin-top:var(--s3)}
.stats{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin:var(--s3) 0;color:var(--mut);font-size:14px}
.set{display:grid;gap:var(--s2);padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.set label,.set .l{display:flex;justify-content:space-between;font-weight:500}
.set output{color:var(--mut)}
input[type=range]{width:100%;accent-color:#A855F7;height:32px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:none;font-weight:500}
.seg button[aria-pressed=true]{border-color:var(--amber);background:#A855F726;font-weight:600}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:var(--s5);width:min(92vw,380px)}
dialog::backdrop{background:#17171766}
dialog h3{margin:0 0 var(--s2);font-size:18px}
dialog p{margin:0 0 var(--s4);color:var(--mut);font-size:15px}
dialog .acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s4)}
#menu{padding:var(--s2)}
#menu button{display:block;width:100%;text-align:left;background:none;border:0;min-height:48px;padding:0 var(--s4);font-size:16px;border-radius:var(--r)}
#menu button:hover{background:#ffffff14}
#studio{position:fixed;inset:0;background:var(--navy);color:#F2EFE8;display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top)}
.sh{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2)}
.sh .m{flex:1;min-width:0;text-align:center}
.sh h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh small{display:inline-flex;align-items:center;gap:6px;color:#A9B0C2;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#6B7389}.dot.ok{background:#3DD68C}.dot.bad{background:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid #2A3250;border-radius:99px;padding:3px 10px;margin-left:var(--s2)}
.pill.rec{border-color:var(--red);color:#FF8A8E}.pill.rec i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.pill.play{border-color:var(--amber);color:var(--amber)}
.cam{position:relative;margin:var(--s1) var(--s3) var(--s3);height:clamp(110px,24dvh,260px);border-radius:12px;overflow:hidden;background:#0A0E19;border:1px solid #232A42;flex:none}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:var(--s2);text-align:center;padding:var(--s4);font-size:14px;color:#C7CCDA;background:#0A0E19}
.cam .msg .btn{min-height:44px;width:auto;padding:0 var(--s4);border-color:var(--amber);color:var(--amber)}
.read{position:relative;flex:1;overflow:hidden;min-height:120px;touch-action:none}
.read .tag{position:absolute;right:var(--s3);top:var(--s1);font-size:12px;font-weight:600;color:#A9B0C2;z-index:2}
.track{position:absolute;left:0;right:0;top:0;padding-left:var(--s5);padding-right:var(--s5);will-change:transform}
.track p{position:relative;margin:0 0 .7em;line-height:1.45;font-weight:600;color:#7B8296}
.track p.cur{color:#F7F4EC}
.track p.cur::before{content:"";position:absolute;left:-18px;top:.45em;border:7px solid transparent;border-left:10px solid var(--amber);border-right:0}
.track p.cue{font-weight:400;font-style:italic;font-size:.6em}
.track.c{text-align:center}.track.mir .t{transform:scaleX(-1)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:2px;padding:var(--s3) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));border-top:1px solid #232A42;background:var(--navy);flex:none}
.bar .ib{color:#F2EFE8;width:46px;height:46px;font-weight:700;font-size:17px}
.bar .ib:hover{background:#1B2238}
.bar .play{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff}
.bar .play:hover{filter:brightness(1.12)}
.bar .rec{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;letter-spacing:.04em;color:#FF8A8E}
.bar .rec span{width:20px;height:20px;border-radius:50%;background:var(--red);display:block}
.bar .rec.on span{border-radius:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#171E33;border-top:1px solid #2A3250;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));max-height:70dvh;overflow:auto}
.sheet .set{border-color:#2A3250}.sheet .seg button{border-color:#2A3250;color:#F2EFE8}.sheet output{color:#A9B0C2}
.toast{position:absolute;left:var(--s3);right:var(--s3);top:calc(60px + env(safe-area-inset-top));z-index:4;background:#171E33;border:1px solid #2A3250;border-radius:12px;padding:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;justify-content:space-between;font-size:14px}
.toast .btn{min-height:40px;width:auto;padding:0 var(--s3);font-size:14px;color:#F2EFE8;border-color:#3A4466}
.toast .btn.amber{color:#fff;border-color:transparent}
@media(min-width:900px){#studio{max-width:760px;left:50%;right:auto;width:100%;transform:translateX(-50%);border-left:1px solid #232A42;border-right:1px solid #232A42}}
.seg.c3{grid-template-columns:repeat(3,1fr)}
#studio.behind .cam{position:absolute;inset:0;margin:0;height:auto;border:0;border-radius:0;z-index:0}
#studio.behind .cam video{object-fit:contain}
#studio.behind.fill .cam video{object-fit:cover}
#studio.behind .cam::after{content:"";position:absolute;inset:0;background:#0B1020;opacity:var(--dim,.55);pointer-events:none}
#studio.behind .sh,#studio.behind .read,#studio.behind .bar{position:relative;z-index:1}
#studio.behind .sh{background:linear-gradient(#0B1020cc,#0B102000)}
#studio.behind .bar{background:#0B1020b3;border-top-color:#ffffff1f}
#studio.behind .track p{color:#D5D8EA;text-shadow:0 2px 12px #000d,0 0 2px #000}
#studio.behind .track p.cur{color:#fff}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 38% at 100% 0%,#6554F030,transparent),radial-gradient(55% 34% at 0% 100%,#3B82F624,transparent)}
